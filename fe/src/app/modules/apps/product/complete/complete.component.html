<div class="card">
    <div class="card-body">
      <h2 class="text-center">Product Details</h2>
  
      <!-- Product Details -->
      <mat-card class="mb-3">
        <mat-card-title>Product</mat-card-title>
        <mat-card-content>
          <p><strong>Name:</strong>  Product Name</p>
          <p><strong>Status:</strong> Active</p>
        </mat-card-content>
      </mat-card>
  
      <!-- Unit Details -->
      <mat-card class="mb-3">
        <mat-card-title>Unit Details</mat-card-title>
        <mat-card-content>
          <p><strong>Unit Type:</strong>  Unit Type</p>
          <p><strong>Quantity:</strong> 100</p>
        </mat-card-content>
      </mat-card>
  
      <!-- Inventory Details -->
      <mat-card class="mb-3">
        <mat-card-title>Inventory Details</mat-card-title>
        <mat-card-content>
          <p><strong>Stock Available:</strong> 50</p>
          <p><strong>Warehouse Location:</strong>  Warehouse Location</p>
        </mat-card-content>
      </mat-card>
  
      <!-- Seller Details -->
      <mat-card class="mb-3">
        <mat-card-title>Seller Details</mat-card-title>
        <mat-card-content>
          <p><strong>Seller Name:</strong>  Seller Name</p>
          <p><strong>Contact:</strong> +1234567890</p>
        </mat-card-content>
      </mat-card>
  
      <!-- Action Buttons -->
      <div class="d-flex justify-content-center mt-4">
        <button mat-raised-button color="primary" class="mr-2" (click)="submit()">Submit</button>
        <button mat-raised-button color="warn" >Cancel</button>
      </div>
    </div>
  </div>
