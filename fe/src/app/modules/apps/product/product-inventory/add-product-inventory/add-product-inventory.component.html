<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Inventory</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">

      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- Unit Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Unit</mat-label>
              <input matInput placeholder="Search Unit" [formControl]="unitIdControl" [matAutocomplete]="autoUnits" />
              <mat-autocomplete #autoUnits="matAutocomplete" [displayWith]="displayUnitName">
                <mat-option *ngFor="let item of filteredUnits | async" [value]="item.id">
                  {{ item.name }}
                </mat-option>
              </mat-autocomplete>
              <mat-error *ngIf="unitIdControl.hasError('required')">Unit is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Quantity Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Quantity</mat-label>
              <input matInput type="text" placeholder="Enter Quantity" formControlName="qty" min="0" step="1" />
              <mat-error>Quantity is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Remaining Quantity, Purchase Price, Sale Price, Notes -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Remaining Quantity</mat-label>
              <input matInput type="text" placeholder="Enter Remaining Quantity" formControlName="rem_qty" min="0"
                step="1" />
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Purchase Price</mat-label>
              <input matInput type="text" placeholder="Enter Purchase Price" formControlName="purchase_price" />
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Sale Price</mat-label>
              <input matInput type="text" placeholder="Enter Sale Price" formControlName="sale_price" />
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Notes</mat-label>
              <textarea matInput placeholder="Enter Notes" formControlName="notes"></textarea>
            </mat-form-field>
          </div>

          <!-- Status Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Status</mat-label>
              <mat-select placeholder="Select Status" formControlName="status">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="0">Inactive</mat-option>
              </mat-select>
              <mat-error>Status is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button [mat-dialog-close]="false" type="button" class="btn btn-primary" [disabled]="isLoading"
    style="margin-right: 5px;">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" [disabled]="isLoading" (click)="submit()" (keyup.enter)="submit()">
    <ng-container *ngIf="!isLoading">
      {{ isEdit ? 'Update' : 'Create' }}
    </ng-container>
    <ng-container *ngIf="isLoading">
      <span clas="indicator-progress" [style.display]="'block'">
        Please wait...{{ ' ' }}
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </ng-container>
  </button>
</div>
