<div class="card">
  <div class="card-body">
    <form class="form" [formGroup]="form" *ngIf="form">
      <div class="row">
        <div class="col-12 kt-margin-bottom-20-mobile">
          <mat-form-field class="w-100">
            <mat-label>Please enter Name </mat-label>
            <input
              matInput
              placeholder="Enter Name"
              formControlName="name"
              maxlength="200"
            />
            <mat-error
              >Name is <strong>required</strong> and must be
              <strong>characters only</strong>
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-12 kt-margin-bottom-20-mobile">
          <mat-form-field class="w-100">
            <mat-label>Status? </mat-label>
            <mat-select placeholder="Status" formControlName="status">
              <mat-option [value]="1">Active</mat-option>
              <mat-option [value]="0">In-Active</mat-option>
            </mat-select>
            <mat-error>Status is <strong>required</strong> </mat-error>
          </mat-form-field>
        </div>
      </div>
      <div class="d-flex justify-content-center">
        <button type="button" class="btn btn-outline-primary" (click)="submit()">
          Save
        </button>
        <button type="button" class="btn btn-outline-info" (click)="nextStep()">
          Next
        </button>
      </div>
    </form>
  </div>
</div>
