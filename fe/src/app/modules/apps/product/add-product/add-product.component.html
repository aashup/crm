<div class="card">
  <div class="card-body">
    <form class="form" [formGroup]="productInfoForm" *ngIf="productInfoForm">
      <div class="row">
        <!-- Name -->
        <div class="col-md-6 col-12 mb-3">
          <mat-form-field class="w-100">
            <mat-label>Please enter Name</mat-label>
            <input matInput placeholder="Enter Name" formControlName="name" maxlength="200" />
            <mat-error>
              Name is <strong>required</strong> and must be <strong>characters only</strong>
            </mat-error>
          </mat-form-field>
        </div>

        <!-- HSN Number -->
        <div class="col-md-6 col-12 mb-3">
          <mat-form-field class="w-100">
            <mat-label>Enter HSN Number</mat-label>
            <input matInput placeholder="Enter HSN" formControlName="hsn" maxlength="200" />
          </mat-form-field>
        </div>

        <!-- Item Code -->
        <div class="col-md-6 col-12 mb-3">
          <mat-form-field class="w-100">
            <mat-label>Enter Item Code</mat-label>
            <input matInput placeholder="Enter Item Code" formControlName="item_code" maxlength="200" />
            <mat-error>
              Item Code is <strong>required</strong> and must be <strong>characters only</strong>
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Status -->
        <div class="col-md-6 col-12 mb-3">
          <mat-form-field class="w-100">
            <mat-label>Status</mat-label>
            <mat-select placeholder="Status" formControlName="status">
              <mat-option [value]="1">Active</mat-option>
              <mat-option [value]="0">In-Active</mat-option>
            </mat-select>
            <mat-error>Status is <strong>required</strong></mat-error>
          </mat-form-field>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex justify-content-center gap-3 mt-3">
        <button type="button" class="btn btn-outline-primary" [disabled]="!productInfoForm.valid" (click)="submit()">
          Save
        </button>
        <button type="button" class="btn btn-outline-primary" (click)="next()" [disabled]="!(productId || isProductCreated)">
          Next
        </button>
      </div>
    </form>
  </div>
</div>
