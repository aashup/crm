<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Unit Conversion</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">

      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- From Unit Autocomplete -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>From Unit</mat-label>
              <input
                matInput
                placeholder=" Please type and search"
                [formControl]="fromUnitControl"
                [matAutocomplete]="autoFrom"
                autocomplete="off"
              />
              <mat-autocomplete #autoFrom="matAutocomplete" [displayWith]="displayUnitName" [autoActiveFirstOption]="false">
                <mat-option *ngFor="let unit of filteredFromUnits | async" [value]="unit.id">
                  {{ unit.name }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>

          <!-- To Unit Autocomplete -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>To Unit</mat-label>
              <input 
                matInput 
                placeholder="Please type and search" 
                [formControl]="toUnitControl" 
                [matAutocomplete]="autoTo"
                autocomplete="off"
              />
              <mat-autocomplete #autoTo="matAutocomplete" [displayWith]="displayUnitName" [autoActiveFirstOption]="false">
                <mat-option *ngFor="let unit of filteredToUnits | async" [value]="unit.id">
                  {{ unit.name }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>

          <!-- Conversion Factor Text Box -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Conversion Factor</mat-label>
              <input matInput placeholder="Enter Conversion Factor" formControlName="conversion_factor" type="number" />
              <mat-error>Conversion Factor is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Description Text Area -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Description</mat-label>
              <textarea matInput placeholder="Enter Description" formControlName="description" rows="3"></textarea>
              <mat-error>Description is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Status Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Status</mat-label>
              <mat-select placeholder="Select Status" formControlName="status">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="0">In-Active</mat-option>
              </mat-select>
              <mat-error>Status is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button [mat-dialog-close]="false" type="button" class="btn btn-primary" [disabled]="isLoading"
    style="margin-right: 5px;">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" [disabled]="isLoading" (click)="submit()" (keyup.enter)="submit()">
    <ng-container *ngIf="!isLoading">
      {{ isEdit ? 'Update' : 'Create' }}
    </ng-container>
    <ng-container *ngIf="isLoading">
      <span class="indicator-progress" [style.display]="'block'">
        Please wait...{{ ' ' }}
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </ng-container>
  </button>
</div>
