<div class="card">
  <div class="card-header border-0 pt-6">
    <div class="card-title">
      <div class="d-flex align-items-center position-relative my-1">
      </div>
    </div>
    <div class="card-toolbar">
      <div class="d-flex justify-content-end gap-2">
        <button
          mat-flat-button
          class="bg-success"
          (click)="add()"
          *ngxPermissionsOnly="['unit.conversions.create']"
        >
          Add New
        </button>
        <button mat-icon-button (click)="loadData()">
          <mat-icon>sync</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="table-responsive">
      <mat-progress-bar
        mode="indeterminate"
        *ngIf="dataSource.loading$ | async"
      ></mat-progress-bar>

      <table
        #table
        cdk-table
        [dataSource]="dataSource"
        matSort
        #sort1="matSort"
        matSortActive="id"
        matSortDirection="desc"
        matSortDisableClear
        class="table table-row-dashed table-row-gray-300 fs-6 align-middle gs-0"
        style="min-width: 1000px;"
      >
        <ng-container *ngFor="let cols of tableColumns; let i = index">
          
          <ng-container [matColumnDef]="cols.ref" *ngIf="cols.ref !== 'action' && cols.ref !== 'select'">
            <th
              cdk-header-cell
              *matHeaderCellDef
              mat-sort-header
              [disabled]="cols.doNotSort"
              class="text-center"
              [ngStyle]="cols.style || {}"
            >
              {{ cols.name }}
            </th>
            <td cdk-cell *matCellDef="let row" class="text-center" [ngStyle]="cols.style || {}">
              {{ cols.mutator ? cols.mutator(row) : _.get(row, cols.ref, "") }}
            </td>
          </ng-container>
          <ng-container [matColumnDef]="cols.ref" *ngIf="cols.ref === 'action'">
            <th cdk-header-cell *matHeaderCellDef class="text-center" [ngStyle]="cols.style || {}">
              {{ cols.name }}
            </th>
            <td mat-cell *matCellDef="let item" class="text-center" [ngStyle]="cols.style || {}">
              <button
                mat-icon-button
                class="text-info"
                (click)="edit(item)"
                *ngxPermissionsOnly="['unit.conversions.update']"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                class="text-danger"
                (click)="delete(item)"
                *ngxPermissionsOnly="['unit.conversions.delete']"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
        </ng-container>
        <tr cdk-header-row *cdkHeaderRowDef="displayableCol"></tr>
        <tr cdk-row *cdkRowDef="let row; columns: displayableCol"></tr>
      </table>
    </div>
    <div class="mat-table__empty-state" *ngIf="!dataSource.hasItems">
      <p class="mat-table__empty-state--not-found">No results found.</p>
    </div>
    <div class="pt-5">
      <mat-spinner [diameter]="20" *ngIf="dataSource.loading$ | async"></mat-spinner>
      <div class="mat-table__floating-modal" *ngIf="selection.selected.length">
        <div class="floating-modal">
          <p class="font-weight-bold m-0" style="font-size: 16px">
            {{ selection.selected.length }} selected
          </p>
          <div class="floating-modal__divider"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="card-footer text-muted">
    <div class="d-flex justify-content-center pt-10">
      <div class="mr-2">
        <button type="button" class="btn btn-outline-info" (click)="prev()">Back</button>
        <button type="button" class="btn btn-outline-info" (click)="next()">Next</button>
      </div>
    </div>
  </div>
</div>
