<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Seller</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Seller </mat-label>
              <mat-select placeholder="Seller" formControlName="seller_id">
                <mat-option *ngFor="let item of sellers" [value]="item.id">
                  {{ item.name }}
                </mat-option>
              </mat-select>
              <mat-error>Seller is <strong>required</strong> </mat-error>
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Please enter Sale Price </mat-label>
              <input
                matInput
                placeholder="Enter Name"
                formControlName="sale_price"
                maxlength="200"
                type="number"
              />
              <mat-error
                >Sale price is <strong>required</strong> and must be
                <strong>Number only</strong>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Please enter Purchase Price </mat-label>
              <input
                matInput
                placeholder="Enter Name"
                formControlName="purchase_price"
                maxlength="200"
                type="number"
              />
              <mat-error
                >Purchase price is <strong>required</strong> and must be
                <strong>Number only</strong>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Status </mat-label>
              <mat-select placeholder="Status" formControlName="status">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="0">In-Active</mat-option>
              </mat-select>
              <mat-error>Status is <strong>required</strong> </mat-error>
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Notes </mat-label>
              <textarea
                matInput
                placeholder="Notes"
                formControlName="notes"
              ></textarea>
              <mat-error>Notes is <strong>required</strong> </mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-button (click)="submit()">
    {{ isEdit ? "Update" : "Create" }}
  </button>
</div>
