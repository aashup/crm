<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Customer</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- Customer Name -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Customer Name</mat-label>
              <input
                matInput
                placeholder="Enter Customer Name"
                formControlName="name"
                maxlength="200"
              />
              <mat-error
                >Customer Name is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Contact Name Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Contact Name</mat-label>
              <mat-select placeholder="Select Contact" formControlName="contact_id">
                <mat-option *ngFor="let contact of contacts" [value]="contact.id">
                  {{ contact.name }}
                </mat-option>
              </mat-select>
              <mat-error
                >Contact Name is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Address Name Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Address Name</mat-label>
              <mat-select placeholder="Select Address" formControlName="address_id">
                <mat-option *ngFor="let address of addresses" [value]="address.id">
                  {{ address.address }}
                </mat-option>
              </mat-select>
              <mat-error
                >Address Name is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-button (click)="submit()" (keyup.enter)="submit()">
    {{ isEdit ? "Update" : "Create" }}
  </button>
</div>
