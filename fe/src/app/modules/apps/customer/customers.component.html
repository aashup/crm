<div class="card">
  <div class="card-header border-0 pt-6">
    <div class="card-title">
      <div class="d-flex align-items-center position-relative my-1">
        <mat-form-field appearance="outline">
          <mat-label>Search in all fields</mat-label>
          <input #searchElementRef matInput placeholder="Search" />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>
    </div>
    <div class="card-toolbar">
      <div class="d-flex justify-content-end">
        <button mat-flat-button class="bg-success" (click)="add()" *ngxPermissionsOnly="['customers.create']">
          Add New
        </button>
        <button mat-icon-button (click)="loadData()">
          <mat-icon>sync</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="table-responsive">
      <mat-progress-bar
        mode="indeterminate"
        *ngIf="dataSource.loading$ | async"
      ></mat-progress-bar>
      <div *ngIf="isLoading" class="loader-overlay">
        <mat-spinner></mat-spinner>
      </div>
      <table
        #table
        cdk-table
        [dataSource]="dataSource"
        matSort
        #sort1="matSort"
        matSortActive="id"
        matSortDirection="desc"
        matSortDisableClear
        class="table table-row-dashed table-row-gray-300 fs-6 align-middle gs-0"
      >
        <ng-container *ngFor="let cols of tableColumns; let i = index">
          <!-- Checkbox Column -->
          <ng-container [matColumnDef]="cols.ref" *ngIf="cols.ref == 'select'">
            <th
              cdk-header-cell
              *matHeaderCellDef
              [ngStyle]="cols.style || {}"
              [attr.aria-label]="'Select all'"
            >
              <mat-checkbox
                [attr.aria-label]="'Select all'"
                (change)="$event ? masterToggle() : null"
                [checked]="selection.hasValue() && isAllSelected()"
                [indeterminate]="selection.hasValue() && !isAllSelected()"
              >
              </mat-checkbox>
            </th>
            <td cdk-cell *matCellDef="let row" [ngStyle]="cols.style || {}">
              <mat-checkbox
                (click)="$event.stopPropagation()"
                (change)="$event ? selection.toggle(row) : null"
                [checked]="selection.isSelected(row)"
              >
              </mat-checkbox>
            </td>
          </ng-container>

          <ng-container
            [matColumnDef]="cols.ref"
            *ngIf="['action', 'select'].indexOf(cols.ref) == -1"
          >
            <th
              cdk-header-cell
              [mat-sort-header]="cols.doNotSort ? null : cols.ref"
              [disabled]="cols.doNotSort ? true : false"
              *matHeaderCellDef
              [class]="cols.class || ''"
              [ngStyle]="cols.style || {}"
            >
              {{ cols.name }}
            </th>
            <td cdk-cell *matCellDef="let row" [ngStyle]="cols.style || {}">
              <div style="display: flex; justify-content: left; align-items: center;">
                <div>
                  {{ cols.mutator ? cols.mutator(row) : _.get(row, cols.ref, "") }}
                </div>
                <button
                  *ngIf="cols.ref === 'address'"
                  mat-icon-button
                  matTooltip="Addres Name: {{ row.address?.address || 'N/A' }},Phone 1: {{ row.address?.mob1 || 'N/A' }}, Phone 2: {{ row.address?.mob2 || 'N/A' }},City:{{getCityName(row.address.city_id)}}, Zip Code: {{ row.address?.pin || 'N/A' }}, Type: {{ row.address?.type===1?'Billing':'Shipping' || 'N/A' }}"
                  matTooltipPosition="above"
                  class="text-info"
                >
                  <mat-icon>info</mat-icon>
                </button>
                <button
                  *ngIf="cols.ref === 'contact'"
                  mat-icon-button
                  matTooltip="Name: {{ row.contact?.name || 'N/A' }}, Phone 1: {{ row.contact?.mob1 || 'N/A' }}, Phone 2: {{ row.contact?.mob2 || 'N/A' }}, "
                  matTooltipPosition="above"
                  class="text-info"
                >
                  <mat-icon>info</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <ng-container [matColumnDef]="cols.ref" *ngIf="cols.ref == 'action'">
            <th
              cdk-header-cell
              [attr.aria-label]="cols.name"
              *matHeaderCellDef
              [ngStyle]="cols.style || {}"
            >
              {{ cols.name }}
            </th>
            <td mat-cell *matCellDef="let item" [ngStyle]="cols.style || {}">
              <button
                mat-icon-button
                class="text-info blod"
                (click)="edit(item)"
                *ngxPermissionsOnly="['customers.update']"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                class="text-danger"
                (click)="delete(item)"
                *ngxPermissionsOnly="['customers.delete']"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
        </ng-container>

        <tr cdk-header-row *cdkHeaderRowDef="displayableCol"></tr>
        <tr cdk-row *cdkRowDef="let row; columns: displayableCol"></tr>
      </table>
    </div>

    <div class="mat-table__empty-state" *ngIf="!dataSource.hasItems">
      <p class="mat-table__empty-state--not-found">No results found.</p>
    </div>

    <div class="pt-5">
      <mat-spinner
        [diameter]="20"
        *ngIf="dataSource.loading$ | async"
      ></mat-spinner>
      <mat-paginator
        [pageSize]="dataSource.paginatorTotal$ | async"
        [length]="dataSource.paginatorTotal$ | async"
      ></mat-paginator>

      <div class="mat-table__floating-modal" *ngIf="selection.selected.length">
        <div class="floating-modal">
          <p class="font-weight-bold m-0" style="font-size: 16px">
            {{ selection.selected.length }} selected
          </p>
          <div class="floating-modal__divider"></div>
        </div>
      </div>
    </div>
  </div>
</div>
