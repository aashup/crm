<div class="verification-message-container">
  <mat-card class="verification-card">
    <mat-card-header class="verification-card-header">
      <mat-icon class="success-icon">check_circle</mat-icon>
      <mat-card-title class="verification-title">Email Verified Successfully!</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="message-text">
        Your email has been successfully verified. You can now log in to your account and start using our services.
      </p>
    </mat-card-content>
    <mat-card-actions class="verification-actions">
      <button mat-raised-button color="primary" routerLink="/auth/login" class="action-button">
        Go to Login
      </button>
    </mat-card-actions>
  </mat-card>
</div>
