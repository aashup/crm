<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm" style="width: 600px;">
    <div class="card-body">
      <h3 class="text-center mb-4">Reset Password</h3>
      <form 
        class="form w-100"
        novalidate="novalidate"
        [formGroup]="resetPasswordForm"
        (ngSubmit)="submit($event)"
        id="kt_login_password_reset_form"
      >
        <!-- Password Field -->
        <div class="mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Password</mat-label>
            <input
              matInput
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="Enter your password"
            />
            <button mat-icon-button matSuffix (click)="showPassword = !showPassword" type="button">
              <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="f['password'].invalid && f['password'].touched">
              Password is required and must be between 8 and 20 characters.
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Confirm Password</mat-label>
            <input
              matInput
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="cpassword"
              formControlName="cpassword"
              placeholder="Confirm your password"
            />
            <button mat-icon-button matSuffix (click)="showConfirmPassword = !showConfirmPassword" type="button">
              <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="f['cpassword'].invalid && f['cpassword'].touched">
              Confirm Password is required and must match the password.
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="kt_sign_in_submit" class="btn btn-primary" style="width: 100%">
         
          <ng-container >
            <span class="indicator-label">Reset Password</span>
          </ng-container>
        </button>
      </form>
    </div>
  </div>
</div>
