<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card shadow-sm" style="width: 600px;">
    <div class="card-body">
      <h3 class="text-center mb-4">Reset Password</h3>
      <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="form-control"
            placeholder="Enter your password"
          />
          <div *ngIf="f['password'].invalid && f['password'].touched" class="text-danger">
            Password is required and must be between 8 and 20 characters.
          </div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            class="form-control"
            placeholder="Confirm your password"
          />
          <div *ngIf="f['confirmPassword'].invalid && f['confirmPassword'].touched" class="text-danger">
            Confirm Password is required and must match the password.
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="resetPasswordForm.invalid || isLoading$ | async">
          Reset Password
        </button>
      </form>
    </div>
  </div>
</div>
