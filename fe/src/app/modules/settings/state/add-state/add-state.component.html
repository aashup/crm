<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} State</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100 mb-5">
              <mat-label>Select Country </mat-label>
              <mat-select placeholder="Country" formControlName="country_id">
                <mat-option *ngFor="let item of countries" [value]="item.id">
                  {{item.name}}
                </mat-option>
              </mat-select>
              <mat-error
                >Country is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Please enter Name </mat-label>
              <input
                matInput
                placeholder="Enter Name"
                formControlName="name"
                maxlength="200"
              />
              <mat-error
                >Name is <strong>required</strong> and must be
                <strong>characters only</strong>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button  [mat-dialog-close]="false" type="button" class="btn btn-primary" [disabled]="isLoading"  style="margin-right: 5px;">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" [disabled]="isLoading" (click)="submit()" (keyup.enter)="submit()">
    <ng-container *ngIf="!isLoading">
      {{ isEdit ? 'Update' : 'Create' }}
    </ng-container>
    <ng-container *ngIf="isLoading">
      <span clas="indicator-progress" [style.display]="'block'">
        Please wait...{{ ' ' }}
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </ng-container>
  </button>
</div>
