<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Contact</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- Name Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Name</mat-label>
              <input
                matInput
                placeholder="Enter Name"
                formControlName="name"
                maxlength="200"
              />
              <mat-error>Name is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Mobile 1</mat-label>
              <input
                matInput
                placeholder="Enter Mobile 1"
                formControlName="mob1"
                maxlength="15"
              />
              <mat-error>Mobile 1 is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Mobile 2 Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Mobile 2</mat-label>
              <input
                matInput
                placeholder="Enter Mobile 2"
                formControlName="mob2"
                maxlength="15"
              />
              <mat-error>Mobile 2 is optional</mat-error>
            </mat-form-field>
          </div>

          <!-- Status Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Status</mat-label>
              <mat-select placeholder="Select Status" formControlName="status">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="0">Inactive</mat-option>
              </mat-select>
              <mat-error>Status is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-button (click)="submit()" (keyup.enter)="submit()">
    {{ isEdit ? "Update" : "Create" }}
  </button>
</div>
