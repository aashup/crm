<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Permission</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <div *ngIf="isLoading" class="loader-overlay">
        <mat-spinner></mat-spinner>
      </div>
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- Description Field -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Please enter Description </mat-label>
              <textarea
                matInput
                placeholder="Enter Description"
                formControlName="description"
                maxlength="500"
              ></textarea>
              <mat-error
                >Description is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Guard Name Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Guard Name</mat-label>
              <mat-select placeholder="Select Guard Name" formControlName="guard_name">
                <mat-option [value]="'api'">API</mat-option>
                <mat-option [value]="'web'">Web</mat-option>
              </mat-select>
              <mat-error
                >Guard Name is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Menu Name Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Menu Name</mat-label>
              <mat-select placeholder="Select Menu Name" formControlName="menu_id">
                <mat-option *ngFor="let menu of menus" [value]="menu.id">
                  {{ menu.name }}
                </mat-option>
              </mat-select>
              <mat-error
                >Menu Name is <strong>required</strong>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button  [mat-dialog-close]="false" type="button" class="btn btn-primary" [disabled]="isLoading"  style="margin-right: 5px;">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" [disabled]="isLoading" (click)="submit()" (keyup.enter)="submit()">
    <ng-container *ngIf="!isLoading">
      {{ isEdit ? 'Update' : 'Create' }}
    </ng-container>
    <ng-container *ngIf="isLoading">
      <span clas="indicator-progress" [style.display]="'block'">
        Please wait...{{ ' ' }}
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </ng-container>
  </button>
</div>
