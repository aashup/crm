<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} User</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- Name Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Name</mat-label>
              <input
                matInput
                placeholder="Enter Name"
                formControlName="name"
                maxlength="200"
              />
              <mat-error>Name is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Email Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Email</mat-label>
              <input
                matInput
                type="email"
                placeholder="Enter Email"
                formControlName="email"
              />
              <mat-error>Email is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Password Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Password</mat-label>
              <input
                matInput
                type="password"
                placeholder="Enter Password"
                formControlName="password"
              />
              <mat-error>Password is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Confirm Password Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Confirm Password</mat-label>
              <input
                matInput
                type="password"
                placeholder="Confirm Password"
                formControlName="cpassword"
              />
              <mat-error>Confirm Password is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Status Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Status</mat-label>
              <mat-select placeholder="Select Status" formControlName="status">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="0">Inactive</mat-option>
              </mat-select>
              <mat-error>Status is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>

          <!-- Roles Multiselect -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Select Roles</mat-label>
              <mat-select
                placeholder="Select Roles"
                formControlName="roles"
                multiple
              >
                <!-- <mat-option *ngFor="let role of roles" [value]="role.id">
                  {{ role.name }}
                </mat-option> -->
              </mat-select>
              <mat-error>At least one role is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Cancel</button>
  <button mat-button (click)="submit()" (keyup.enter)="submit()">
    {{ isEdit ? "Update" : "Create" }}
  </button>
</div>
