<h2 mat-dialog-title>{{ isEdit ? "Edit" : "Create" }} Role</h2>
<div mat-dialog-content>
  <div class="card m-auto">
    <div class="card-body min-w-500px">
      <div *ngIf="isLoading" class="loader-overlay">
        <mat-spinner></mat-spinner>
      </div>
      <form class="form" [formGroup]="form" *ngIf="form">
        <div class="row">
          <!-- Roles Input -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Enter Role</mat-label>
              <input
                matInput
                placeholder="Enter Role"
                formControlName="name"
                maxlength="200"
              />
              <mat-error>Role is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
          
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Type</mat-label>
              <mat-select placeholder="Select Type" formControlName="guard_name">
                <mat-option [value]="'api'">API</mat-option>
                <mat-option [value]="'web'">Web</mat-option>
              </mat-select>
              <mat-error>Type is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
          <!-- Status Dropdown -->
          <div class="col-12 kt-margin-bottom-20-mobile">
            <mat-form-field class="w-100">
              <mat-label>Status</mat-label>
              <mat-select placeholder="Select Status" formControlName="status">
                <mat-option [value]="1">Active</mat-option>
                <mat-option [value]="2">Inactive</mat-option>
              </mat-select>
              <mat-error>Status is <strong>required</strong></mat-error>
            </mat-form-field>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button  [mat-dialog-close]="false" type="button" class="btn btn-primary" [disabled]="isLoading"  style="margin-right: 5px;">
    Cancel
  </button>
  <button type="button" class="btn btn-primary" [disabled]="isLoading" (click)="submit()" (keyup.enter)="submit()">
    <ng-container *ngIf="!isLoading">
      {{ isEdit ? 'Update' : 'Create' }}
    </ng-container>
    <ng-container *ngIf="isLoading">
      <span clas="indicator-progress" [style.display]="'block'">
        Please wait...{{ ' ' }}
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </ng-container>
  </button>
</div>
