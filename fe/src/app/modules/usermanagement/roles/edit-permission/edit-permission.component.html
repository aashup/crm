<mat-card>
    
    <mat-card-title>
      
     
    </mat-card-title>

    <mat-card-content>
      <div
      style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;margin-top: 10px;"
      >
        <mat-form-field appearance="outline" class="search-field" style="width: 300px;">
            <mat-label>Search section</mat-label>
            <input matInput [(ngModel)]="searchText"  />
          </mat-form-field>
      
          <mat-checkbox [(ngModel)]="selectAll">Select All</mat-checkbox>
      </div>
  
      <div *ngFor="let section of filteredSections()" class="section-container">
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>{{ section.name }}</mat-panel-title>
          </mat-expansion-panel-header>
  
          <div class="permission-options">
            <div *ngFor="let permission of permissions">
              <mat-checkbox [(ngModel)]="section[permission.id]">{{ permission.name }}</mat-checkbox>
            </div>
          </div>
  
          <button mat-raised-button color="primary" (click)="addNewPermission(section)">
            + New
          </button>
        </mat-expansion-panel>
      </div>
  
      <div class="action-buttons">
        <button mat-button (click)="resetPermissions()">Reset</button>
        <button mat-raised-button color="primary" (click)="saveChanges()">Save Changes</button>
      </div>
    </mat-card-content>
  </mat-card>
