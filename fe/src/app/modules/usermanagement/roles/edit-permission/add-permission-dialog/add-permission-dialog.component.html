<h2 mat-dialog-title>Add New Permission</h2>
<mat-dialog-content class="dialog-content" style="padding: 15px;">
  <div class="form-wrapper">
    <mat-form-field appearance="outline" class="full-width" >
        <mat-label>Description</mat-label>
        <input matInput [(ngModel)]="description" (keyup)="clearError()" />
      </mat-form-field>
      
      <mat-error *ngIf="error" class="error-message" style="color: red;"> 
        {{ error }}
      </mat-error>


    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="guard_name">
        <mat-option value="web">Web</mat-option>
        <mat-option value="api">API</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="savePermission()">Save</button>
</mat-dialog-actions>
