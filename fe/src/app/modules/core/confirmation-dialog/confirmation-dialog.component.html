<h2 mat-dialog-title>{{ data.title || "Delete" }}</h2>
<div mat-dialog-content>
  <div [innerHTML]="data.body || 'Are you sure to delete this?'"></div>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">{{data.cancelBtnName || 'Cancel'}}</button>
  <button mat-button [mat-dialog-close]="true" autofocus>{{data.okBtnName || 'Ok'}}</button>
</div>
