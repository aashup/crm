<div class="dashboard">
    <h2 class="dashboard-title">Store Purchase Dashboard</h2>
  
    <!-- Line Chart Section -->
    <div class="chart-section">
      <apx-chart
        [series]="monthlyTrendsSeries"
        [chart]="monthlyTrendsChart"
        [xaxis]="xAxis"
        [stroke]="stroke"
        [dataLabels]="dataLabels"
        [title]="chartTitle"
        [legend]="legend">
      </apx-chart>
    </div>
  
    <!-- Pie Chart Section -->
    <div class="chart-section">
      <apx-chart
        [series]="pieChartSeries"
        [chart]="pieChartDetails"
        [labels]="pieChartLabels"
        [responsive]="pieResponsive"
        [title]="pieTitle">
      </apx-chart>
    </div>
  </div>
